<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coderco Container Challenge</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .subtitle {
            color: var(--muted-text);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .counter-box {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .counter-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #bae6fd;
            margin-bottom: 0.25rem;
        }

        .counter-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .nav-link {
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Coderco Container Challenge</h1>
        <p class="subtitle">Welcome to your styled cloud application.</p>
        
        <div class="counter-box">
            <div class="counter-label">Total Page Visits</div>
            <div class="counter-value">{{ count }}</div>
        </div>

        {% if page == 'home' %}
            <a class="nav-link" href="/count">Go to Counter Page →</a>
        {% else %}
            <a class="nav-link" href="/">← Go to Home Page</a>
        {% endif %}
    </div>

</body>
</html>
